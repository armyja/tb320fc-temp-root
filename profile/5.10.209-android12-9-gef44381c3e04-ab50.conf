# GhostLock 候选 profil: 联想 TB320FC (Qualcomm SM8475 / cape, ZUX OS 1.1.350 出厂 boot.img)。
# 未在真机上验证过。所有 offset.* 均以该内核链接基址 _text = 0xffffffc008000000 为基准,
# 与 kallsyms 绝对地址换算一致。
#
# 数据来源:
#   [img] = 从 boot_17.0.350_stock.img 重建的 vmlinux 反汇编直接读出(已交叉核对)
#   [kmi] = android12-5.10 KMI 第 9 代已冻结布局(与内置 5.10.236-android12-9 profil 逐项一致,
#           其中 13 项已用 [img] 反汇编复核)
#   [sym] = 该镜像 kallsyms 符号表
release = "5.10.209-android12-9-gef44381c3e04-ab50"
schema_version = 1
kernel_major = 5
recommend_shizuku = 0
# 均已在设备上实测确认:
#   kernel_phys_offset: /proc/zoneinfo start_pfn=524288 -> 0x80000000
#   kernel_phys_load  : root 态 /proc/iomem "Kernel code a8000000-aa48ffff" (见 iomem-5.10.209.txt)
kernel_phys_load = 2818572288
kernel_phys_offset = 2147483648
route {
  # 多播路由(旧的 5.x 首选)在这台内核上栈几何不成立: waiter_off=336 > buffer_size=264,
  # 因此改用 select()/pselect 路由。waiter_shift 由反汇编推导 (见 README 推导过程)。
  select_stack {
    # 实机验证值: 应用内部 waiter word 索引比结构体索引大 2, 所以是 -2 而不是工具推导的 0
    waiter_shift = -2
  }
  # 5.10/6.1 的 rt_mutex_waiter 是 compact 布局(rb_node, 无 tree/pi prio+deadline);
  # 应用只从 tcp 分支取 compact_waiter 标志, 所以这里显式写上, 否则 select 路由会按 6.6 布局伪造。
  tcp_zerocopy {
    compact_waiter = 1
  }
}
fallback {
  to = "none"
}
kernelsnitch {
  collisions = 4
  # sizeof(struct mm_struct) = 0x3c0 = 960, 从 mm_cache_init 的 mov w1,#0x3c0 读出
  mm_struct_sz = 960
}
task_struct {
  prio = 132                       # 0x084 [img] rt_mutex_setprio
  normal_prio = 140                # 0x08c [img] rt_mutex_setprio
  sched_task_group = 784           # 0x310 [img] sched_move_task
  pi_lock = 2156                   # 0x86c [img] task_blocks_on_rt_mutex 的 casa 抢锁点
  pi_waiters = 2176                # 0x880 [img] rt_mutex_enqueue_pi 调用点
  pi_top_task = 2192               # 0x890 [img] rt_mutex_setprio
  pi_blocked_on = 2200             # 0x898 [img] task_blocks_on_rt_mutex
  pid = 1480                       # 0x5c8 [img] copy_process
  tgid = 1484                      # 0x5cc [img] copy_process
  atomic_flags = 1424              # 0x590 [kmi] (唯一未能用本镜像反汇编复核的字段)
  real_cred = 1912                 # 0x778 [img] commit_creds
  cred = 1920                      # 0x780 [img] commit_creds
  comm = 1936                      # 0x790 [img] __set_task_comm
  tasks = 1224                     # 0x4c8 [img] copy_process (INIT_LIST_HEAD)
  seccomp = 2120                   # 0x848 [img] __secure_computing
}
cred {
  copy_size = 168                  # 0x0a8 [img] prepare_creds memcpy 长度
  usage_offset = 0                 # [img] commit_creds ldar [cred]
  usage_value = 1
  caps_offset = 40                 # 0x028 [img] commit_creds 比较 euid/egid/fsuid/fsgid 之后的 cap_inheritable
  caps_count = 5                   # inheritable/permitted/effective/bset/ambient, 40..80
  caps_value = -1
  ref_count = 3
  ref0_offset = 128                # ->user       = root_user   [img] prepare_creds
  ref0_image = -274702010784       # 0xffffffc00a7bf660 [sym]
  ref1_offset = 136                # ->user_ns    = init_user_ns [img] commit_creds (与 init_user_ns 比较)
  ref1_image = -274702010632       # 0xffffffc00a7bf6f8 [sym]
  ref2_offset = 144                # ->group_info = init_groups  [img] prepare_creds
  ref2_image = -274702005368       # 0xffffffc00a7c0b88 [sym]
  ref3_offset = null               # CONFIG_USER_NS=n, cred 中没有 ucounts 字段
  ref3_image = null
}
offset {
  init_task = 41598656             # 0x027abec0 -> ffffffc00a7abec0 [sym]
  init_cred = 41683680             # 0x027c0ae0 -> ffffffc00a7c0ae0 [sym]
  empty_zero_page = 43638784       # 0x0299e000 -> ffffffc00a99e000 [sym]
  root_task_group = 43659328       # 0x029a3040 -> ffffffc00a9a3040 [sym]
  selinux_enforcing = 44379112     # 0x02a52be8 = selinux_state+0 (SELINUX_DISABLE=n, DEVELOP=y) [sym]
  selinux_blob_sizes = 36673016    # 0x022f95f8 -> ffffffc00a2f95f8 [sym]
  security_hook_heads = 36671336   # 0x022f8f68 -> ffffffc00a2f8f68 [sym]
  slide_nfulnl_logger = 41554848   # 0x027a13a0 -> ffffffc00a7a13a0 [sym]
  slide_loggers_0_1 = 41554648     # 0x027a12c8 -> ffffffc00a7a12c8 [sym]
  slide_boot_id = 44506165         # 0x02a71c35 -> ffffffc00aa71c35 [sym]
}
